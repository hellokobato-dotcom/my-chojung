<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>직원 관리 및 인건비 결산 - 데모 버전</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 사이드바 -->
    <aside class="sidebar">
        <div class="logo">
            <h2 style="color: white; margin-top: 1rem;">초정 가계부</h2>
        </div>
        <nav>
            <a href="#"><i class="fas fa-home"></i> <span>대시보드</span></a>
            <a href="#" class="active"><i class="fas fa-users"></i> <span>인건비 관리</span></a>
            <a href="#"><i class="fas fa-receipt"></i> <span>지출 관리</span></a>
            <a href="#"><i class="fas fa-chart-line"></i> <span>매출 관리</span></a>
        </nav>
    </aside>

    <!-- 메인 컨텐츠 -->
    <div class="container">
        <header class="page-header">
            <div>
                <h1><i class="fas fa-users"></i> 직원 관리 및 인건비 결산 <span style="font-size: 14px; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; padding: 4px 12px; border-radius: 20px; margin-left: 12px;">데모</span></h1>
                <p>LocalStorage 사용 - API 서버 불필요</p>
            </div>
            <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                <button class="btn-secondary" onclick="exportToExcel()">
                    <i class="fas fa-file-excel"></i> 엑셀 다운로드
                </button>
                <button class="btn-primary" onclick="openEmployeeModal(null)">
                    <i class="fas fa-user-plus"></i> 직원 등록
                </button>
            </div>
        </header>

        <!-- 통계 카드 -->
        <div class="summary-grid">
            <div class="summary-card">
                <div class="summary-icon" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                    <i class="fas fa-users"></i>
                </div>
                <div class="summary-content">
                    <h3>총 직원 수</h3>
                    <p class="summary-value" id="totalEmployees">0명</p>
                </div>
            </div>
            <div class="summary-card">
                <div class="summary-icon" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                    <i class="fas fa-won-sign"></i>
                </div>
                <div class="summary-content">
                    <h3>이번 달 총 지급액</h3>
                    <p class="summary-value" id="totalPayment">0원</p>
                </div>
            </div>
            <div class="summary-card">
                <div class="summary-icon" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
                    <i class="fas fa-clock"></i>
                </div>
                <div class="summary-content">
                    <h3>총 근무시간</h3>
                    <p class="summary-value" id="totalHours">0시간</p>
                </div>
            </div>
            <div class="summary-card">
                <div class="summary-icon" style="background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);">
                    <i class="fas fa-calculator"></i>
                </div>
                <div class="summary-content">
                    <h3>평균 시급/월급</h3>
                    <p class="summary-value" id="averageWage" style="font-size: 18px;">-</p>
                </div>
            </div>
        </div>

        <!-- 탭 네비게이션 -->
        <div class="tab-navigation">
            <button class="tab-btn active" data-tab="employees" onclick="switchTab('employees')">
                <i class="fas fa-users"></i> 직원 목록
            </button>
            <button class="tab-btn" data-tab="payments" onclick="switchTab('payments')">
                <i class="fas fa-file-invoice-dollar"></i> 급여 지급 내역
            </button>
        </div>

        <!-- 직원 목록 탭 -->
        <div id="employeesTab" class="data-container tab-content">
            <div class="data-header">
                <h2><i class="fas fa-list"></i> 직원 목록</h2>
                <div class="search-filter-area">
                    <select id="filterStatus" onchange="filterEmployees()">
                        <option value="">전체 상태</option>
                        <option value="재직">재직</option>
                        <option value="퇴직">퇴직</option>
                    </select>
                    <select id="filterDepartment" onchange="filterEmployees()">
                        <option value="">전체 부서</option>
                    </select>
                    <select id="filterEmploymentType" onchange="filterEmployees()">
                        <option value="">전체 고용형태</option>
                        <option value="일용직">일용직</option>
                        <option value="상용직">상용직</option>
                    </select>
                    <input type="text" id="searchEmployee" placeholder="이름, 연락처로 검색..." style="min-width: 250px;" oninput="filterEmployees()">
                </div>
            </div>

            <!-- 통합 테이블 -->
            <div class="integrated-table">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 80px;">사진</th>
                            <th>이름</th>
                            <th>부서</th>
                            <th>고용형태</th>
                            <th>연락처</th>
                            <th>시급/월급</th>
                            <th style="width: 100px; text-align: center;">상태</th>
                            <th style="width: 200px; text-align: center;">관리</th>
                        </tr>
                    </thead>
                    <tbody id="employeeTableBody">
                        <tr>
                            <td colspan="8" class="empty-state">
                                <i class="fas fa-users"></i>
                                <h3>직원 데이터를 불러오는 중...</h3>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 급여 지급 내역 탭 -->
        <div id="paymentsTab" class="data-container tab-content" style="display: none;">
            <div class="data-header">
                <h2><i class="fas fa-file-invoice-dollar"></i> 급여 지급 내역</h2>
                <div class="search-filter-area">
                    <select id="filterPaymentYear" onchange="filterPayments()">
                        <option value="">전체 연도</option>
                    </select>
                    <select id="filterPaymentMonth" onchange="filterPayments()">
                        <option value="">전체 월</option>
                        <option value="1">1월</option>
                        <option value="2">2월</option>
                        <option value="3">3월</option>
                        <option value="4">4월</option>
                        <option value="5">5월</option>
                        <option value="6">6월</option>
                        <option value="7">7월</option>
                        <option value="8">8월</option>
                        <option value="9">9월</option>
                        <option value="10">10월</option>
                        <option value="11">11월</option>
                        <option value="12">12월</option>
                    </select>
                    <input type="text" id="searchPayment" placeholder="직원 이름으로 검색..." style="min-width: 250px;" oninput="filterPayments()">
                </div>
            </div>

            <!-- 급여 지급 내역 테이블 -->
            <div class="integrated-table">
                <table>
                    <thead>
                        <tr>
                            <th>지급일</th>
                            <th>직원명</th>
                            <th>고용형태</th>
                            <th>근무시간</th>
                            <th style="text-align: right;">기본급</th>
                            <th style="text-align: right;">공제액</th>
                            <th style="text-align: right;">지급액</th>
                            <th style="text-align: center;">신고여부</th>
                            <th style="width: 150px; text-align: center;">관리</th>
                        </tr>
                    </thead>
                    <tbody id="paymentTableBody">
                        <tr>
                            <td colspan="9" class="empty-state">
                                <i class="fas fa-file-invoice"></i>
                                <h3>급여 지급 내역이 없습니다</h3>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 직원/급여 통합 모달 -->
    <div id="employeeModal" class="modal-overlay">
        <div class="modal-content-large">
            <div class="modal-header">
                <h2><i class="fas fa-user-edit"></i> <span id="modalTitle">직원 등록</span></h2>
                <button class="modal-close" onclick="closeEmployeeModal()">&times;</button>
            </div>

            <div class="modal-body">
                <form id="employeeForm" onsubmit="return false;">
                    <input type="hidden" id="employeeId">
                    <input type="hidden" id="photoUrl">

                    <!-- 1. 기본 정보 -->
                    <div class="form-section">
                        <div class="form-section-title">
                            <i class="fas fa-id-card"></i> 기본 정보
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label><i class="fas fa-user"></i> 이름 *</label>
                                <input type="text" id="employeeName" required placeholder="이름을 입력하세요">
                            </div>
                            <div class="form-group">
                                <label><i class="fas fa-building"></i> 부서 *</label>
                                <input type="text" id="employeeDepartment" required placeholder="예: 현장, 사무실, 영업">
                            </div>
                            <div class="form-group">
                                <label><i class="fas fa-phone"></i> 연락처 *</label>
                                <input type="tel" id="employeePhone" required placeholder="010-0000-0000">
                            </div>
                        </div>
                    </div>

                    <!-- 2. 고용 정보 -->
                    <div class="form-section">
                        <div class="form-section-title">
                            <i class="fas fa-briefcase"></i> 고용 정보
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label><i class="fas fa-user-tag"></i> 고용 형태 *</label>
                                <select id="employmentType" required onchange="toggleSalaryFields()">
                                    <option value="">선택하세요</option>
                                    <option value="일용직">일용직</option>
                                    <option value="상용직">상용직</option>
                                </select>
                            </div>
                            <div class="form-group" id="hourlyRateGroup" style="display: none;">
                                <label><i class="fas fa-won-sign"></i> 시급 *</label>
                                <input type="number" id="hourlyRate" placeholder="예: 11800" min="0" step="10">
                            </div>
                            <div class="form-group" id="monthlySalaryGroup" style="display: none;">
                                <label><i class="fas fa-won-sign"></i> 월급 *</label>
                                <input type="number" id="monthlySalary" placeholder="예: 3000000" min="0" step="10000">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label><i class="fas fa-calendar-plus"></i> 입사일 *</label>
                                <input type="date" id="hireDate" required>
                            </div>
                            <div class="form-group">
                                <label><i class="fas fa-calendar-minus"></i> 퇴사일</label>
                                <input type="date" id="resignDate">
                            </div>
                            <div class="form-group">
                                <label><i class="fas fa-user-check"></i> 재직 상태 *</label>
                                <select id="employeeStatus" required>
                                    <option value="재직">재직</option>
                                    <option value="퇴직">퇴직</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label><i class="fas fa-university"></i> 계좌번호</label>
                                <input type="text" id="bankAccount" placeholder="은행명과 계좌번호">
                            </div>
                        </div>
                    </div>

                    <!-- 3. 급여 지급 정보 -->
                    <div class="form-section">
                        <div class="form-section-title">
                            <i class="fas fa-file-invoice-dollar"></i> 급여 지급 정보 (선택사항)
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label><i class="fas fa-calendar-check"></i> 지급일</label>
                                <input type="date" id="paymentDate">
                            </div>
                            <div class="form-group">
                                <label><i class="fas fa-calendar"></i> 연도</label>
                                <input type="number" id="paymentYear" min="2020" max="2100" placeholder="2026">
                            </div>
                            <div class="form-group">
                                <label><i class="fas fa-calendar-alt"></i> 월</label>
                                <select id="paymentMonth">
                                    <option value="">선택</option>
                                    <option value="1">1월</option>
                                    <option value="2">2월</option>
                                    <option value="3">3월</option>
                                    <option value="4">4월</option>
                                    <option value="5">5월</option>
                                    <option value="6">6월</option>
                                    <option value="7">7월</option>
                                    <option value="8">8월</option>
                                    <option value="9">9월</option>
                                    <option value="10">10월</option>
                                    <option value="11">11월</option>
                                    <option value="12">12월</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label><i class="fas fa-clock"></i> 근무시간</label>
                                <input type="number" id="workHours" min="0" step="0.5" placeholder="예: 200" oninput="calculatePayroll()">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label><i class="fas fa-coins"></i> 기본급 (자동 계산)</label>
                                <input type="number" id="baseSalary" class="computed-value" readonly>
                            </div>
                            <div class="form-group">
                                <label><i class="fas fa-minus-circle"></i> 공제액 (자동 계산)</label>
                                <input type="number" id="deductions" class="computed-value" readonly>
                            </div>
                            <div class="form-group">
                                <label><i class="fas fa-hand-holding-usd"></i> 최종 지급액</label>
                                <input type="number" id="netPay" class="computed-value" readonly>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label><i class="fas fa-file-alt"></i> 신고 여부</label>
                                <select id="isReported">
                                    <option value="미신고">미신고</option>
                                    <option value="신고">신고</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label><i class="fas fa-sticky-note"></i> 비고</label>
                                <input type="text" id="notes" placeholder="메모">
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-cancel" onclick="closeEmployeeModal()">
                    <i class="fas fa-times"></i> 취소
                </button>
                <button type="button" class="btn-save" onclick="saveEmployee()">
                    <i class="fas fa-save"></i> 저장
                </button>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script>
// 전역 변수
let employees = [];
let payments = [];
let currentTab = 'employees';

// 페이지 로드 시 초기화
document.addEventListener('DOMContentLoaded', function() {
    console.log('🚀 데모 버전 초기화 시작');
    checkAndInitializeMockData();
    loadEmployees();
    loadPayments();
    
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('paymentYear').value = new Date().getFullYear();
    document.getElementById('paymentMonth').value = new Date().getMonth() + 1;
    
    setTimeout(() => {
        showSuccess('🎉 데모 버전에 오신 것을 환영합니다!');
    }, 500);
});

// Mock 데이터 초기화
function checkAndInitializeMockData() {

        const mockEmployees = [
            {id: 'emp-001', name: '김철수', department: '현장', phone: '010-1234-5678', employment_type: '일용직', hourly_rate: 12000, monthly_salary: 0, bank_account: '국민은행 123-456-789012', hire_date: '2024-01-15', resign_date: null, status: '재직', photo_url: null},
            {id: 'emp-002', name: '이영희', department: '사무실', phone: '010-2345-6789', employment_type: '상용직', hourly_rate: 0, monthly_salary: 3200000, bank_account: '신한은행 987-654-321098', hire_date: '2023-06-01', resign_date: null, status: '재직', photo_url: null},
            {id: 'emp-003', name: '박민수', department: '현장', phone: '010-3456-7890', employment_type: '일용직', hourly_rate: 11800, monthly_salary: 0, bank_account: '우리은행 456-789-012345', hire_date: '2024-03-01', resign_date: null, status: '재직', photo_url: null},
            {id: 'emp-004', name: '정수진', department: '영업', phone: '010-4567-8901', employment_type: '상용직', hourly_rate: 0, monthly_salary: 2800000, bank_account: '하나은행 789-012-345678', hire_date: '2023-09-15', resign_date: null, status: '재직', photo_url: null},
            {id: 'emp-005', name: '최동욱', department: '현장', phone: '010-5678-9012', employment_type: '일용직', hourly_rate: 13000, monthly_salary: 0, bank_account: '기업은행 012-345-678901', hire_date: '2024-02-01', resign_date: '2024-02-28', status: '퇴직', photo_url: null}
        ];
        
        const mockPayments = [
            {id: 'pay-001', employee_id: 'emp-001', employee_name: '김철수', employment_type: '일용직', payment_date: '2026-02-28', payment_year: 2026, payment_month: 2, work_hours: 180, hourly_rate: 12000, monthly_salary: 0, base_salary: 2160000, deductions: 19440, net_pay: 2140560, is_reported: '신고', notes: '2월 급여'},
            {id: 'pay-002', employee_id: 'emp-002', employee_name: '이영희', employment_type: '상용직', payment_date: '2026-02-28', payment_year: 2026, payment_month: 2, work_hours: 0, hourly_rate: 0, monthly_salary: 3200000, base_salary: 3200000, deductions: 273960, net_pay: 2926040, is_reported: '신고', notes: '2월 급여'},
            {id: 'pay-003', employee_id: 'emp-003', employee_name: '박민수', employment_type: '일용직', payment_date: '2026-02-28', payment_year: 2026, payment_month: 2, work_hours: 200, hourly_rate: 11800, monthly_salary: 0, base_salary: 2360000, deductions: 21240, net_pay: 2338760, is_reported: '신고', notes: '2월 급여'},
            {id: 'pay-004', employee_id: 'emp-001', employee_name: '김철수', employment_type: '일용직', payment_date: '2026-03-11', payment_year: 2026, payment_month: 3, work_hours: 80, hourly_rate: 12000, monthly_salary: 0, base_salary: 960000, deductions: 8640, net_pay: 951360, is_reported: '미신고', notes: '3월 첫째주'}
        ];
        
        localStorage.setItem('demo_employees', JSON.stringify(mockEmployees));
        localStorage.setItem('demo_payments', JSON.stringify(mockPayments));
        console.log('✅ Mock 데이터 초기화 완료');
    }
}

// 직원 데이터 로드
function loadEmployees() {
    const data = localStorage.getItem('demo_employees');
    employees = data ? JSON.parse(data) : [];
    updateDepartmentFilter();
    renderEmployees(employees);
    updateStatistics();
}

// 급여 데이터 로드
function loadPayments() {
    const data = localStorage.getItem('demo_payments');
    payments = data ? JSON.parse(data) : [];
    updateYearFilter();
    renderPayments(payments);
}

// 부서 필터 업데이트
function updateDepartmentFilter() {
    const departments = [...new Set(employees.map(emp => emp.department).filter(d => d))];
    const select = document.getElementById('filterDepartment');
    departments.forEach(dept => {
        if (!Array.from(select.options).some(opt => opt.value === dept)) {
            select.add(new Option(dept, dept));
        }
    });
}

// 연도 필터 업데이트
function updateYearFilter() {
    const years = [...new Set(payments.map(pay => pay.payment_year).filter(y => y))];
    years.sort((a, b) => b - a);
    const select = document.getElementById('filterPaymentYear');
    select.innerHTML = '<option value="">전체 연도</option>';
    years.forEach(year => select.add(new Option(year + '년', year)));
}

// 직원 목록 렌더링
function renderEmployees(data) {
    const tbody = document.getElementById('employeeTableBody');
    if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="empty-state"><i class="fas fa-users"></i><h3>등록된 직원이 없습니다</h3></td></tr>';
        return;
    }
    
    tbody.innerHTML = data.map(emp => {
        const avatar = emp.photo_url ? `<img src="${emp.photo_url}" class="employee-avatar">` : `<div class="employee-avatar-placeholder">${emp.name.substring(0,2)}</div>`;
        const wage = emp.employment_type === '일용직' ? formatCurrency(emp.hourly_rate) + '/시간' : formatCurrency(emp.monthly_salary) + '/월';
        const statusClass = emp.status === '재직' ? 'status-active' : 'status-inactive';
        
        return `
            <tr>
                <td>${avatar}</td>
                <td><strong>${emp.name}</strong></td>
                <td>${emp.department}</td>
                <td>${emp.employment_type}</td>
                <td>${emp.phone}</td>
                <td>${wage}</td>
                <td style="text-align: center;"><span class="status-badge ${statusClass}">${emp.status}</span></td>
                <td style="text-align: center;">
                    <div class="action-buttons">
                        <button class="btn-confirm" onclick="openPayrollModal('${emp.id}')" ${emp.status !== '재직' ? 'disabled' : ''}>
                            <i class="fas fa-money-bill-wave"></i> 급여
                        </button>
                        <button class="btn-icon" onclick="openEmployeeModal('${emp.id}')">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn-icon" onclick="deleteEmployee('${emp.id}')" style="color: #e74c3c;">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </td>
            </tr>
        `;
    }).join('');
}

// 급여 내역 렌더링
function renderPayments(data) {
    const tbody = document.getElementById('paymentTableBody');
    if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" class="empty-state"><i class="fas fa-file-invoice"></i><h3>급여 지급 내역이 없습니다</h3></td></tr>';
        return;
    }
    
    data.sort((a, b) => new Date(b.payment_date) - new Date(a.payment_date));
    
    tbody.innerHTML = data.map(pay => {
        const reportBadge = pay.is_reported === '신고' ? '<span class="status-badge status-active">신고</span>' : '<span class="status-badge status-inactive">미신고</span>';
        
        return `
            <tr>
                <td>${formatDate(pay.payment_date)}</td>
                <td><strong>${pay.employee_name}</strong></td>
                <td>${pay.employment_type}</td>
                <td>${pay.work_hours || '-'}시간</td>
                <td style="text-align: right;">${formatCurrency(pay.base_salary)}</td>
                <td style="text-align: right;">${formatCurrency(pay.deductions)}</td>
                <td style="text-align: right;"><strong>${formatCurrency(pay.net_pay)}</strong></td>
                <td style="text-align: center;">${reportBadge}</td>
                <td style="text-align: center;">
                    <div class="action-buttons">
                        <button class="btn-icon" onclick="deletePayment('${pay.id}')" style="color: #e74c3c;">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </td>
            </tr>
        `;
    }).join('');
}

// 검색/필터링
function filterEmployees() {
    const search = document.getElementById('searchEmployee').value.toLowerCase();
    const status = document.getElementById('filterStatus').value;
    const department = document.getElementById('filterDepartment').value;
    const type = document.getElementById('filterEmploymentType').value;
    
    const filtered = employees.filter(emp => {
        return (!search || emp.name.toLowerCase().includes(search) || emp.phone.includes(search)) &&
               (!status || emp.status === status) &&
               (!department || emp.department === department) &&
               (!type || emp.employment_type === type);
    });
    
    renderEmployees(filtered);
}

function filterPayments() {
    const search = document.getElementById('searchPayment').value.toLowerCase();
    const year = document.getElementById('filterPaymentYear').value;
    const month = document.getElementById('filterPaymentMonth').value;
    
    const filtered = payments.filter(pay => {
        return (!search || pay.employee_name.toLowerCase().includes(search)) &&
               (!year || pay.payment_year === parseInt(year)) &&
               (!month || pay.payment_month === parseInt(month));
    });
    
    renderPayments(filtered);
}

// 탭 전환
function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
    document.getElementById('employeesTab').style.display = tab === 'employees' ? 'block' : 'none';
    document.getElementById('paymentsTab').style.display = tab === 'payments' ? 'block' : 'none';
}

// 통계 업데이트
function updateStatistics() {
    const activeEmployees = employees.filter(emp => emp.status === '재직').length;
    document.getElementById('totalEmployees').textContent = `${activeEmployees}명`;
    
    const currentMonth = new Date().getMonth() + 1;
    const currentYear = new Date().getFullYear();
    const monthlyPayments = payments.filter(pay => pay.payment_year === currentYear && pay.payment_month === currentMonth);
    
    const totalPayment = monthlyPayments.reduce((sum, pay) => sum + (pay.net_pay || 0), 0);
    document.getElementById('totalPayment').textContent = formatCurrency(totalPayment);
    
    const totalHours = monthlyPayments.reduce((sum, pay) => sum + (pay.work_hours || 0), 0);
    document.getElementById('totalHours').textContent = totalHours.toFixed(1) + '시간';
    
    const dailyEmp = employees.filter(emp => emp.employment_type === '일용직' && emp.hourly_rate);
    const monthlyEmp = employees.filter(emp => emp.employment_type === '상용직' && emp.monthly_salary);
    
    let avgWage = '-';
    if (dailyEmp.length > 0 || monthlyEmp.length > 0) {
        const avgDaily = dailyEmp.length > 0 ? dailyEmp.reduce((sum, emp) => sum + emp.hourly_rate, 0) / dailyEmp.length : 0;
        const avgMonthly = monthlyEmp.length > 0 ? monthlyEmp.reduce((sum, emp) => sum + emp.monthly_salary, 0) / monthlyEmp.length : 0;
        
        avgWage = '';
        if (avgDaily > 0) avgWage += `시급 ${formatCurrency(avgDaily)}`;
        if (avgMonthly > 0) {
            if (avgWage) avgWage += ' / ';
            avgWage += `월급 ${formatCurrency(avgMonthly)}`;
        }
    }
    document.getElementById('averageWage').textContent = avgWage;
}

// 모달 열기/닫기
function openEmployeeModal(employeeId) {
    const modal = document.getElementById('employeeModal');
    const form = document.getElementById('employeeForm');
    form.reset();
    
    if (employeeId) {
        const emp = employees.find(e => e.id === employeeId);
        if (emp) {
            document.getElementById('modalTitle').textContent = '직원 정보 수정';
            document.getElementById('employeeId').value = emp.id;
            document.getElementById('employeeName').value = emp.name;
            document.getElementById('employeeDepartment').value = emp.department;
            document.getElementById('employeePhone').value = emp.phone;
            document.getElementById('employmentType').value = emp.employment_type;
            document.getElementById('hourlyRate').value = emp.hourly_rate;
            document.getElementById('monthlySalary').value = emp.monthly_salary;
            document.getElementById('bankAccount').value = emp.bank_account;
            document.getElementById('hireDate').value = emp.hire_date;
            document.getElementById('resignDate').value = emp.resign_date || '';
            document.getElementById('employeeStatus').value = emp.status;
            toggleSalaryFields();
        }
    } else {
        document.getElementById('modalTitle').textContent = '직원 등록';
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('hireDate').value = today;
    }
    
    modal.style.display = 'block';
}

function openPayrollModal(employeeId) {
    openEmployeeModal(employeeId);
    document.getElementById('modalTitle').textContent = '급여 지급';
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('paymentDate').value = today;
    setTimeout(() => document.getElementById('workHours').focus(), 300);
}

function closeEmployeeModal() {
    document.getElementById('employeeModal').style.display = 'none';
}

// 시급/월급 필드 토글
function toggleSalaryFields() {
    const type = document.getElementById('employmentType').value;
    const hourlyGroup = document.getElementById('hourlyRateGroup');
    const monthlyGroup = document.getElementById('monthlySalaryGroup');
    const hourlyInput = document.getElementById('hourlyRate');
    const monthlyInput = document.getElementById('monthlySalary');
    
    if (type === '일용직') {
        hourlyGroup.style.display = 'block';
        monthlyGroup.style.display = 'none';
        hourlyInput.required = true;
        monthlyInput.required = false;
    } else if (type === '상용직') {
        hourlyGroup.style.display = 'none';
        monthlyGroup.style.display = 'block';
        hourlyInput.required = false;
        monthlyInput.required = true;
    } else {
        hourlyGroup.style.display = 'none';
        monthlyGroup.style.display = 'none';
    }
    
    calculatePayroll();
}

// 급여 자동 계산
function calculatePayroll() {
    const type = document.getElementById('employmentType').value;
    const hourlyRate = parseFloat(document.getElementById('hourlyRate').value) || 0;
    const monthlySalary = parseFloat(document.getElementById('monthlySalary').value) || 0;
    const workHours = parseFloat(document.getElementById('workHours').value) || 0;
    
    let baseSalary = 0;
    let deductions = 0;
    
    if (type === '일용직') {
        baseSalary = hourlyRate * workHours;
        deductions = Math.round(baseSalary * 0.009);
    } else if (type === '상용직') {
        baseSalary = monthlySalary;
        const nationalPension = Math.round(baseSalary * 0.045);
        const healthInsurance = Math.round(baseSalary * 0.03545);
        const longTermCare = Math.round(healthInsurance * 0.1295);
        const employmentInsurance = Math.round(baseSalary * 0.009);
        deductions = nationalPension + healthInsurance + longTermCare + employmentInsurance;
    }
    
    const netPay = baseSalary - deductions;
    
    document.getElementById('baseSalary').value = Math.round(baseSalary);
    document.getElementById('deductions').value = Math.round(deductions);
    document.getElementById('netPay').value = Math.round(netPay);
}

// 직원 저장
function saveEmployee() {
    const name = document.getElementById('employeeName').value.trim();
    const department = document.getElementById('employeeDepartment').value.trim();
    const phone = document.getElementById('employeePhone').value.trim();
    const type = document.getElementById('employmentType').value;
    const hireDate = document.getElementById('hireDate').value;
    
    if (!name || !department || !phone || !type || !hireDate) {
        alert('필수 항목을 모두 입력해주세요.');
        return;
    }
    
    const hourlyRate = parseFloat(document.getElementById('hourlyRate').value) || 0;
    const monthlySalary = parseFloat(document.getElementById('monthlySalary').value) || 0;
    
    if (type === '일용직' && hourlyRate <= 0) {
        alert('일용직은 시급을 입력해야 합니다.');
        return;
    }
    
    if (type === '상용직' && monthlySalary <= 0) {
        alert('상용직은 월급을 입력해야 합니다.');
        return;
    }
    
    const employeeData = {
        name, department, phone,
        employment_type: type,
        hourly_rate: hourlyRate,
        monthly_salary: monthlySalary,
        bank_account: document.getElementById('bankAccount').value.trim(),
        hire_date: hireDate,
        resign_date: document.getElementById('resignDate').value || null,
        status: document.getElementById('employeeStatus').value,
        photo_url: null
    };
    
    const employeeId = document.getElementById('employeeId').value;
    let savedId = employeeId;
    
    if (employeeId) {
        const index = employees.findIndex(emp => emp.id === employeeId);
        if (index !== -1) {
            employees[index] = { ...employees[index], ...employeeData };
        }
    } else {
        savedId = 'emp-' + Date.now();
        employeeData.id = savedId;
        employees.push(employeeData);
    }
    
    localStorage.setItem('demo_employees', JSON.stringify(employees));
    
    // 급여 정보 저장
    const paymentDate = document.getElementById('paymentDate').value;
    const workHours = parseFloat(document.getElementById('workHours').value) || 0;
    const baseSalary = parseFloat(document.getElementById('baseSalary').value) || 0;
    
    if (paymentDate && (workHours > 0 || baseSalary > 0)) {
        const paymentData = {
            id: 'pay-' + Date.now(),
            employee_id: savedId,
            employee_name: name,
            employment_type: type,
            payment_date: paymentDate,
            payment_year: parseInt(document.getElementById('paymentYear').value),
            payment_month: parseInt(document.getElementById('paymentMonth').value),
            work_hours: workHours,
            hourly_rate: hourlyRate,
            monthly_salary: monthlySalary,
            base_salary: baseSalary,
            deductions: parseFloat(document.getElementById('deductions').value) || 0,
            net_pay: parseFloat(document.getElementById('netPay').value) || 0,
            is_reported: document.getElementById('isReported').value,
            notes: document.getElementById('notes').value.trim()
        };
        
        payments.push(paymentData);
        localStorage.setItem('demo_payments', JSON.stringify(payments));
        showSuccess(employeeId ? '직원 정보와 급여가 저장되었습니다!' : '새 직원과 급여가 등록되었습니다!');
    } else {
        showSuccess(employeeId ? '직원 정보가 수정되었습니다!' : '새 직원이 등록되었습니다!');
    }
    
    closeEmployeeModal();
    loadEmployees();
    loadPayments();
}

// 직원 삭제
function deleteEmployee(employeeId) {
    const emp = employees.find(e => e.id === employeeId);
    if (!emp) return;
    
    if (!confirm(`${emp.name} 직원을 삭제하시겠습니까?`)) return;
    
    employees = employees.filter(e => e.id !== employeeId);
    payments = payments.filter(p => p.employee_id !== employeeId);
    
    localStorage.setItem('demo_employees', JSON.stringify(employees));
    localStorage.setItem('demo_payments', JSON.stringify(payments));
    
    showSuccess('직원이 삭제되었습니다.');
    loadEmployees();
    loadPayments();
}

// 급여 삭제
function deletePayment(paymentId) {
    if (!confirm('급여 내역을 삭제하시겠습니까?')) return;
    
    payments = payments.filter(p => p.id !== paymentId);
    localStorage.setItem('demo_payments', JSON.stringify(payments));
    
    showSuccess('급여 내역이 삭제되었습니다.');
    loadPayments();
    updateStatistics();
}

// 엑셀 내보내기
function exportToExcel() {
    const data = currentTab === 'employees' ? employees : payments;
    if (data.length === 0) {
        alert('내보낼 데이터가 없습니다.');
        return;
    }
    
    const headers = currentTab === 'employees' 
        ? ['이름', '부서', '고용형태', '연락처', '시급', '월급', '입사일', '상태']
        : ['지급일', '직원명', '고용형태', '근무시간', '기본급', '공제액', '지급액', '신고여부'];
    
    const rows = data.map(item => 
        currentTab === 'employees'
            ? [item.name, item.department, item.employment_type, item.phone, item.hourly_rate, item.monthly_salary, item.hire_date, item.status]
            : [item.payment_date, item.employee_name, item.employment_type, item.work_hours, item.base_salary, item.deductions, item.net_pay, item.is_reported]
    );
    
    const csv = [headers, ...rows].map(row => row.map(cell => `"${cell || ''}"`).join(',')).join('\n');
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `${currentTab === 'employees' ? '직원목록' : '급여내역'}_${formatDate(new Date())}.csv`;
    link.click();
    
    showSuccess('엑셀 파일이 다운로드되었습니다!');
}

// 모달 외부 클릭 시 닫기
window.onclick = function(event) {
    const modal = document.getElementById('employeeModal');
    if (event.target === modal) {
        closeEmployeeModal();
    }
};

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>직원 관리 시스템 2026 - 초정</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            font-family: 'Noto Sans KR', sans-serif;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5568d3; transform: translateY(-2px); }
        .btn-success { background: #10b981; color: white; }
        .btn-success:hover { background: #059669; transform: translateY(-2px); }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-warning:hover { background: #d97706; transform: translateY(-2px); }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        .stat-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 8px;
        }
        .stat-value {
            font-size: 28px;
            font-weight: 900;
        }
        
        .employees-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .employee-card {
            background: #f9fafb;
            border-radius: 15px;
            padding: 25px;
            border: 2px solid #e5e7eb;
            transition: all 0.3s;
        }
        .employee-card:hover {
            border-color: #667eea;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.2);
            transform: translateY(-5px);
        }
        .emp-name {
            font-size: 22px;
            font-weight: 900;
            color: #1f2937;
            margin-bottom: 10px;
        }
        .emp-info {
            color: #6b7280;
            font-size: 14px;
            margin: 5px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .emp-actions {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }
        .btn-sm {
            padding: 8px 16px;
            font-size: 13px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }
        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: white;
            border-radius: 20px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 25px 30px;
            border-radius: 20px 20px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-body {
            padding: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 700;
            color: #374151;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 15px;
            font-family: 'Noto Sans KR', sans-serif;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        .modal-footer {
            padding: 20px 30px;
            background: #f9fafb;
            border-radius: 0 0 20px 20px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 20px 25px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: none;
            align-items: center;
            gap: 15px;
            z-index: 2000;
            min-width: 300px;
        }
        .toast.show { display: flex; animation: slideIn 0.3s; }
        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .toast.success .toast-icon { background: #d1fae5; color: #065f46; }
        .toast.error .toast-icon { background: #fee2e2; color: #991b1b; }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }
        .empty-state i {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <i class="fas fa-users"></i>
            직원 관리 및 인건비 결산 시스템
        </h1>
        <div class="subtitle">
            초정 육전밀면 갈비탕 전문점 | 2026년 버전 | <span id="currentDate"></span>
        </div>
        
        <div class="actions">
            <button class="btn btn-primary" onclick="openAddModal()">
                <i class="fas fa-user-plus"></i> 직원 추가
            </button>
            <button class="btn btn-success" onclick="exportExcel()">
                <i class="fas fa-file-excel"></i> 엑셀 내보내기
            </button>
            <button class="btn btn-warning" onclick="generatePDF()">
                <i class="fas fa-file-pdf"></i> PDF 명세서
            </button>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">총 직원 수</div>
                <div class="stat-value" id="totalEmployees">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">이번 달 지급액</div>
                <div class="stat-value" id="monthlyTotal">0원</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">평균 시급</div>
                <div class="stat-value" id="avgWage">0원</div>
            </div>
        </div>
        
        <div id="employeesGrid" class="employees-grid"></div>
    </div>
    
    <!-- 직원 추가/수정 모달 -->
    <div id="employeeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-user-edit"></i> <span id="modalTitle">직원 등록</span></h2>
                <button class="btn btn-sm" onclick="closeModal()" style="background: rgba(255,255,255,0.2);">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="employeeForm">
                    <input type="hidden" id="empId">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> 이름 *</label>
                        <input type="text" id="empName" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-building"></i> 부서 *</label>
                        <select id="empDept" required>
                            <option value="">선택</option>
                            <option value="대표관리">대표관리</option>
                            <option value="홀매니저">홀매니저</option>
                            <option value="주방매니저">주방매니저</option>
                            <option value="위생매니저">위생매니저</option>
                            <option value="안전매니저">안전매니저</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-phone"></i> 전화번호 *</label>
                        <input type="tel" id="empPhone" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-briefcase"></i> 고용형태 *</label>
                        <select id="empType" required>
                            <option value="">선택</option>
                            <option value="정규직">정규직</option>
                            <option value="계약직">계약직</option>
                            <option value="일용직">일용직</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-won-sign"></i> 시급 *</label>
                        <input type="number" id="empWage" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-calendar"></i> 입사일 *</label>
                        <input type="date" id="empHireDate" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal()" style="background: #6b7280; color: white;">
                    취소
                </button>
                <button class="btn btn-primary" onclick="saveEmployee()">
                    <i class="fas fa-save"></i> 저장
                </button>
            </div>
        </div>
    </div>
    
    <!-- 토스트 알림 -->
    <div id="toast" class="toast">
        <div class="toast-icon"><i class="fas fa-check"></i></div>
        <div>
            <div style="font-weight: 700; margin-bottom: 4px;" id="toastTitle">성공</div>
            <div style="font-size: 14px; color: #6b7280;" id="toastMsg">작업 완료</div>
        </div>
    </div>
    
    <script>
        // 전역 변수
        let employees = [];
        let payments = [];
        
        // 페이지 로드 시 실행
        document.addEventListener('DOMContentLoaded', function() {
            console.log('시스템 초기화 시작...');
            
            // 현재 날짜 표시
            document.getElementById('currentDate').textContent = new Date().toLocaleDateString('ko-KR');
            
            // 데이터 로드
            loadData();
            
            // 샘플 데이터 생성 (데이터 없을 경우)
            if (employees.length === 0) {
                console.log('샘플 데이터 생성 중...');
                createSampleData();
            }
            
            // UI 렌더링
            renderEmployees();
            updateStats();
            
            console.log('시스템 준비 완료!');
            showToast('success', '시스템 준비', '정상 로드되었습니다');
        });
        
        // 데이터 로드
        function loadData() {
            try {
                const empData = localStorage.getItem('employees_2026');
                const payData = localStorage.getItem('payments_2026');
                if (empData) employees = JSON.parse(empData);
                if (payData) payments = JSON.parse(payData);
                console.log('데이터 로드 완료:', employees.length, '명');
            } catch (e) {
                console.error('데이터 로드 오류:', e);
            }
        }
        
        // 데이터 저장
        function saveData() {
            try {
                localStorage.setItem('employees_2026', JSON.stringify(employees));
                localStorage.setItem('payments_2026', JSON.stringify(payments));
                console.log('데이터 저장 완료');
            } catch (e) {
                console.error('데이터 저장 오류:', e);
            }
        }
        
        // 샘플 데이터 생성
        function createSampleData() {
            employees = [
                {
                    id: 'emp1',
                    name: '김대표',
                    department: '대표관리',
                    phone: '010-1234-5678',
                    employmentType: '정규직',
                    hourlyWage: 25000,
                    hireDate: '2020-01-01'
                },
                {
                    id: 'emp2',
                    name: '박매니저',
                    department: '홀매니저',
                    phone: '010-2345-6789',
                    employmentType: '정규직',
                    hourlyWage: 15000,
                    hireDate: '2021-03-01'
                }
            ];
            saveData();
            console.log('샘플 데이터 생성 완료');
        }
        
        // 직원 목록 렌더링
        function renderEmployees() {
            const grid = document.getElementById('employeesGrid');
            
            if (employees.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <i class="fas fa-users-slash"></i>
                        <h3>등록된 직원이 없습니다</h3>
                        <p>직원 추가 버튼을 클릭하여 등록하세요</p>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = employees.map(emp => `
                <div class="employee-card">
                    <div class="emp-name">${emp.name}</div>
                    <div class="emp-info">
                        <i class="fas fa-building"></i> ${emp.department}
                    </div>
                    <div class="emp-info">
                        <i class="fas fa-phone"></i> ${emp.phone}
                    </div>
                    <div class="emp-info">
                        <i class="fas fa-briefcase"></i> ${emp.employmentType}
                    </div>
                    <div class="emp-info">
                        <i class="fas fa-won-sign"></i> ${formatNumber(emp.hourlyWage)}원/시간
                    </div>
                    <div class="emp-actions">
                        <button class="btn btn-sm btn-primary" onclick="editEmployee('${emp.id}')">
                            <i class="fas fa-edit"></i> 수정
                        </button>
                        <button class="btn btn-sm" onclick="deleteEmployee('${emp.id}')" 
                                style="background: #ef4444; color: white;">
                            <i class="fas fa-trash"></i> 삭제
                        </button>
                    </div>
                </div>
            `).join('');
        }
        
        // 통계 업데이트
        function updateStats() {
            document.getElementById('totalEmployees').textContent = employees.length;
            const avgWage = employees.length > 0 
                ? Math.round(employees.reduce((sum, e) => sum + e.hourlyWage, 0) / employees.length)
                : 0;
            document.getElementById('avgWage').textContent = formatNumber(avgWage) + '원';
            document.getElementById('monthlyTotal').textContent = '0원'; // 추후 구현
        }
        
        // 모달 열기 (추가)
        function openAddModal() {
            document.getElementById('modalTitle').textContent = '직원 등록';
            document.getElementById('employeeForm').reset();
            document.getElementById('empId').value = '';
            document.getElementById('empHireDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('employeeModal').classList.add('active');
        }
        
        // 모달 열기 (수정)
        function editEmployee(id) {
            const emp = employees.find(e => e.id === id);
            if (!emp) return;
            
            document.getElementById('modalTitle').textContent = '직원 수정';
            document.getElementById('empId').value = emp.id;
            document.getElementById('empName').value = emp.name;
            document.getElementById('empDept').value = emp.department;
            document.getElementById('empPhone').value = emp.phone;
            document.getElementById('empType').value = emp.employmentType;
            document.getElementById('empWage').value = emp.hourlyWage;
            document.getElementById('empHireDate').value = emp.hireDate;
            document.getElementById('employeeModal').classList.add('active');
        }
        
        // 모달 닫기
        function closeModal() {
            document.getElementById('employeeModal').classList.remove('active');
        }
        
        // 직원 저장
        function saveEmployee() {
            const form = document.getElementById('employeeForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }
            
            const id = document.getElementById('empId').value || 'emp' + Date.now();
            const empData = {
                id: id,
                name: document.getElementById('empName').value,
                department: document.getElementById('empDept').value,
                phone: document.getElementById('empPhone').value,
                employmentType: document.getElementById('empType').value,
                hourlyWage: parseInt(document.getElementById('empWage').value),
                hireDate: document.getElementById('empHireDate').value
            };
            
            const existingIndex = employees.findIndex(e => e.id === id);
            if (existingIndex >= 0) {
                employees[existingIndex] = empData;
                showToast('success', '수정 완료', empData.name + '님 정보 수정');
            } else {
                employees.push(empData);
                showToast('success', '등록 완료', empData.name + '님 등록');
            }
            
            saveData();
            renderEmployees();
            updateStats();
            closeModal();
        }
        
        // 직원 삭제
        function deleteEmployee(id) {
            const emp = employees.find(e => e.id === id);
            if (!emp || !confirm(emp.name + '님을 삭제하시겠습니까?')) return;
            
            employees = employees.filter(e => e.id !== id);
            saveData();
            renderEmployees();
            updateStats();
            showToast('success', '삭제 완료', emp.name + '님 삭제');
        }
        
        // Excel 내보내기
        function exportExcel() {
            try {
                if (typeof XLSX === 'undefined') {
                    alert('Excel 라이브러리 로드 중입니다. 잠시 후 다시 시도해주세요.');
                    return;
                }
                
                const wb = XLSX.utils.book_new();
                const wsData = [
                    ['초정 육전밀면 갈비탕 - 직원 명부'],
                    ['작성일: ' + new Date().toISOString().split('T')[0]],
                    [],
                    ['이름', '부서', '전화번호', '고용형태', '시급', '입사일']
                ];
                
                employees.forEach(emp => {
                    wsData.push([
                        emp.name,
                        emp.department,
                        emp.phone,
                        emp.employmentType,
                        emp.hourlyWage,
                        emp.hireDate
                    ]);
                });
                
                const ws = XLSX.utils.aoa_to_sheet(wsData);
                XLSX.utils.book_append_sheet(wb, ws, '직원명부');
                XLSX.writeFile(wb, '초정_직원명부_' + new Date().toISOString().split('T')[0] + '.xlsx');
                
                showToast('success', '다운로드 완료', 'Excel 파일 저장됨');
            } catch (error) {
                console.error('Excel error:', error);
                showToast('error', '오류 발생', error.message);
            }
        }
        
        // PDF 생성
        function generatePDF() {
            let html = '<!DOCTYPE html><html><head><meta charset="UTF-8">';
            html += '<style>body{font-family:"Noto Sans KR",sans-serif;padding:40px}';
            html += 'h1{color:#667eea}table{width:100%;border-collapse:collapse;margin-top:20px}';
            html += 'th,td{border:1px solid #ddd;padding:12px;text-align:left}';
            html += 'th{background:#667eea;color:white}</style></head><body>';
            html += '<h1>초정 육전밀면 갈비탕 - 직원 명부</h1>';
            html += '<p>작성일: ' + new Date().toLocaleDateString('ko-KR') + '</p>';
            html += '<table><thead><tr>';
            html += '<th>이름</th><th>부서</th><th>전화번호</th><th>고용형태</th><th>시급</th><th>입사일</th>';
            html += '</tr></thead><tbody>';
            
            employees.forEach(emp => {
                html += '<tr>';
                html += '<td>' + emp.name + '</td>';
                html += '<td>' + emp.department + '</td>';
                html += '<td>' + emp.phone + '</td>';
                html += '<td>' + emp.employmentType + '</td>';
                html += '<td>' + formatNumber(emp.hourlyWage) + '원</td>';
                html += '<td>' + emp.hireDate + '</td>';
                html += '</tr>';
            });
            
            html += '</tbody></table>';
            html += '<div style="margin-top:40px;text-align:center">';
            html += '<button onclick="window.print()" style="padding:12px 24px;background:#667eea;color:white;border:none;border-radius:8px;cursor:pointer;font-size:16px">인쇄하기</button>';
            html += '</div></body></html>';
            
            const printWindow = window.open('', '_blank');
            printWindow.document.write(html);
            printWindow.document.close();
            
            showToast('success', 'PDF 준비', '인쇄 창이 열렸습니다');
        }
        
        // 토스트 알림
        function showToast(type, title, message) {
            const toast = document.getElementById('toast');
            toast.className = 'toast show ' + type;
            document.getElementById('toastTitle').textContent = title;
            document.getElementById('toastMsg').textContent = message;
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
        
        // 숫자 포맷
        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }
    </script>
